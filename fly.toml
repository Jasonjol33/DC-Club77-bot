# App-Name (muss zu deiner Fly-App passen)
app = "dc-club77-bot"
primary_region = "fra"

[build]

# Der Bot ist ein reiner Worker (kein Webserver) -> kein [http_service]
[processes]
  app = "node index.js"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
  processes = ["app"]

# Bot nach einem Absturz immer wieder starten (24/7)
[[restart]]
  policy = "always"
